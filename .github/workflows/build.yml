# 编译 SideTray，并在打 tag 时自动发 Release。
#
# 触发方式：
#   - push 到 main：只编译 + 上传 artifact（Actions 页面可下载）
#   - push 形如 v1.0.0 的 tag：编译 + 建 GitHub Release，附上 SideTray-win-x64.zip
#   - 也可以在 Actions 页面手动「Run workflow」
#
# 为什么跑在 windows-latest：这是 .NET Framework 4.8 的 WinForms 程序，
# runner 自带 MSBuild + 4.8，不需要装 .NET SDK。MSBuild 万一不可用会退回系统自带 csc，
# 两条路产物一致（都是 bin 下的 SideTray.exe）。

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时要建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 找 MSBuild（找不到不报错，后面会退回 csc）
        id: msbuild
        shell: pwsh
        run: |
          $path = ''
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $path = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
                    Select-Object -First 1
          }
          if (-not $path -or -not (Test-Path $path)) {
            $cmd = Get-Command msbuild -ErrorAction SilentlyContinue
            if ($cmd) { $path = $cmd.Source }
          }
          if ($path -and (Test-Path $path)) {
            "path=$path" >> $env:GITHUB_OUTPUT
            Write-Host "MSBuild: $path"
          } else {
            Write-Host '没找到 MSBuild，将退回 csc'
          }

      - name: 编译
        shell: pwsh
        run: |
          $exe = $null
          $msbuild = '${{ steps.msbuild.outputs.path }}'
          if ($msbuild -and (Test-Path $msbuild)) {
            & $msbuild SideTray.csproj /p:Configuration=Release /v:minimal /nologo
            if (Test-Path 'bin\Release\SideTray.exe') { $exe = 'bin\Release\SideTray.exe' }
          }
          if (-not $exe) {
            Write-Host '退回 csc 直接编译（build.ps1）'
            & .\build.ps1
            if (Test-Path 'bin\SideTray.exe') { $exe = 'bin\SideTray.exe' }
          }
          if (-not $exe) { throw '编译失败：MSBuild 和 csc 都没产出 SideTray.exe' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe 'dist\SideTray.exe' -Force
          $kb = [math]::Round((Get-Item $exe).Length / 1KB, 1)
          Write-Host "产物：$exe（$kb KB）"

      - name: 打包 zip
        id: pack
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            "0.0.0-$(($env:GITHUB_SHA).Substring(0,7))"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item 'README.md' dist/
          Compress-Archive -Path 'dist\*' -DestinationPath 'SideTray-win-x64.zip' -Force
          Write-Host "已打包 SideTray-win-x64.zip（版本 $version）"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideTray-win-x64
          path: SideTray-win-x64.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SideTray-win-x64.zip
          name: 副屏任务栏音频控制 v${{ steps.pack.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
